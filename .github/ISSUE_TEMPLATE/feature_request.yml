name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature request and why it matters.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem should this solve?
      placeholder: As a ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Describe your proposed solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any alternatives or workarounds?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add references, mockups, or linked issues.
