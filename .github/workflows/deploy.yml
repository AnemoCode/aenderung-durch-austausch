name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: overlytics
          POSTGRES_USER: overlytics
          POSTGRES_PASSWORD: overlytics
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-placeholder-not-used-in-production
          DEBUG: "True"
          POSTGRES_DB: overlytics
          POSTGRES_USER: overlytics
          POSTGRES_PASSWORD: overlytics
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          # Valid 32-byte Fernet key (all-zeros) — CI only, never used in prod.
          FIELD_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: uv run python manage.py check

  # ── Build & push images ──────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04-arm
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
      ghcr-owner: ${{ steps.image-tag.outputs.owner }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: image-tag
        run: |
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.image-tag.outputs.owner }}/overlytics:${{ steps.image-tag.outputs.tag }}
            ghcr.io/${{ steps.image-tag.outputs.owner }}/overlytics:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: |
            ghcr.io/${{ steps.image-tag.outputs.owner }}/overlytics-worker:${{ steps.image-tag.outputs.tag }}
            ghcr.io/${{ steps.image-tag.outputs.owner }}/overlytics-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-24.04-arm
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file to server
        run: |
          scp docker-compose.prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/overlytics/docker-compose.prod.yml

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ needs.build.outputs.ghcr-owner }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            set -e
            cd /opt/overlytics
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" GHCR_OWNER="$GHCR_OWNER" \
            docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="$IMAGE_TAG" GHCR_OWNER="$GHCR_OWNER" \
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -f
          EOF

      - name: Verify deployment
        run: |
          sleep 15
          curl -sf "http://${{ secrets.SERVER_HOST }}:8000/health/" \
            && echo "Health check passed" \
            || { echo "Health check failed"; exit 1; }
