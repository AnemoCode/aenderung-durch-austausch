services:
  docs:
    image: aenderung_durch_austausch_local_docs
    container_name: aenderung_durch_austausch_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./aenderung_durch_austausch:/app/aenderung_durch_austausch:z
    ports:
      - '9000:9000'
    command: /start-docs
