[project]
name = "aenderung-durch-austausch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "django-taggit>=6.0",
    "bleach[css]>=6.0",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "django-debug-toolbar>=4.4",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "*/celery.py",
    "*/staging_data.py",
    "manage.py",
    ".venv/*",
    "staticfiles/*",
    "apps/topics/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
