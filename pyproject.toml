[project]
name = "overlytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "cryptography>=46.0.5",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4",
]
