services:
  web:
    image: ghcr.io/${GHCR_OWNER}/aenderung-durch-austausch:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "7777:8000"
    networks:
      - aeda-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

networks:
  aeda-network:
    external: true
