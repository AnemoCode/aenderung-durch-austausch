services:
  db:
    image: postgres:17-alpine
    volumes:
      - ${POSTGRES_DATA_PATH:-/opt/aenderung-durch-austausch/postgres}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER}/aenderung-durch-austausch:${IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - ${MEDIA_HOST_PATH:-/opt/aenderung-durch-austausch/media}:/app/data/media
    ports:
      - "7777:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Nightly database and media backup, see docs/operations/backup-restore.md.
  # The deploy workflow copies scripts/ next to this file on the server.
  backup:
    image: postgres:17-alpine
    command: ["sh", "/scripts/backup-scheduler.sh"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /backups
      BACKUP_MEDIA_DIR: /media
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_HOST_PATH:-/opt/aenderung-durch-austausch/backups}:/backups
      - ${MEDIA_HOST_PATH:-/opt/aenderung-durch-austausch/media}:/media:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
