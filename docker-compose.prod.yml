services:
  db:
    image: postgres:17-alpine
    volumes:
      - ${POSTGRES_DATA_PATH:-/opt/overlytics/postgres}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER}/overlytics:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "8500:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  celery_worker:
    image: ghcr.io/${GHCR_OWNER}/overlytics-worker:${IMAGE_TAG:-latest}
    command: celery -A overlytics worker --loglevel=info --concurrency=1
    env_file: .env
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
      web:   { condition: service_healthy }
    restart: unless-stopped

  celery_beat:
    image: ghcr.io/${GHCR_OWNER}/overlytics-worker:${IMAGE_TAG:-latest}
    command: >
      celery -A overlytics beat --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }
      web:   { condition: service_healthy }
    restart: unless-stopped
