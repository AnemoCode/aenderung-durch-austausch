services:
  db:
    image: postgres:17-alpine
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aenderung-durch-austausch}
      POSTGRES_USER: ${POSTGRES_USER:-aenderung-durch-austausch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aenderung-durch-austausch}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aenderung-durch-austausch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      target: builder
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - venv:/app/.venv
      - ${MEDIA_HOST_PATH:-./data/media}:/app/data/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "migrate", "--check"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  venv:
