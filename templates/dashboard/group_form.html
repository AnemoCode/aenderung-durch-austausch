{% extends "base.html" %}

{% block content %}

<div class="max-w-lg">
    <div class="mb-6">
        <a href="{% url 'dashboard:groups' %}"
           class="inline-flex items-center gap-1.5 text-sm text-forest/60 hover:text-forest transition-colors mb-4">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Zurück zu Gruppen
        </a>
        <h1 class="text-2xl font-bold text-forest">Neue Gruppe erstellen</h1>
        <p class="text-sm text-forest/60 mt-1">Du wirst automatisch als Admin der Gruppe eingetragen.</p>
    </div>

    <div class="bg-white rounded-xl border border-beige shadow-sm p-6">
        <form method="post" novalidate>
            {% csrf_token %}

            <div class="mb-6">
                <label for="id_name" class="block text-sm font-medium text-forest mb-1.5">
                    Gruppenname
                </label>
                <input type="text"
                       name="name"
                       id="id_name"
                       value="{{ form.name.value|default:'' }}"
                       placeholder="z. B. ML Research Group"
                       autofocus
                       class="w-full rounded-lg border px-3 py-2.5 text-sm text-forest
                              {% if form.name.errors %}border-rose-400 bg-rose-50{% else %}border-beige bg-cream{% endif %}
                              focus:outline-none focus:border-forest/40 focus:ring-2 focus:ring-forest/10 transition">
                {% for error in form.name.errors %}
                <p class="mt-1 text-xs text-rose-500">{{ error }}</p>
                {% endfor %}
            </div>

            <div class="flex items-center gap-3">
                <button type="submit"
                        class="bg-forest hover:bg-forest/90 text-cream font-medium text-sm px-5 py-2.5 rounded-lg transition-colors shadow-sm">
                    Gruppe erstellen
                </button>
                <a href="{% url 'dashboard:groups' %}"
                   class="text-sm text-forest/60 hover:text-forest transition-colors">
                    Abbrechen
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
