{% extends "base.html" %}

{% block content %}

<div class="max-w-lg">
    <div class="mb-6">
        <a href="{% url 'dashboard:projects' %}"
           class="inline-flex items-center gap-1.5 text-sm text-forest/60 hover:text-forest transition-colors mb-4">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Zurück zu Projekten
        </a>
        <h1 class="text-2xl font-bold text-forest">Projekt löschen</h1>
    </div>

    <div class="bg-white rounded-xl border border-rose-200 shadow-sm p-6">
        <div class="flex items-start gap-4 mb-6">
            <div class="p-2.5 rounded-lg bg-rose-50 border border-rose-200 flex-shrink-0">
                <i data-lucide="trash-2" class="w-5 h-5 text-rose-600"></i>
            </div>
            <div>
                <p class="text-sm font-medium text-forest">
                    Bist du sicher, dass du <strong>„{{ object.name }}"</strong> löschen möchtest?
                </p>
                <p class="text-sm text-forest/60 mt-1">
                    Das Projekt wird dauerhaft aus der Datenbank entfernt. Diese Aktion kann nicht rückgängig gemacht werden.
                </p>
            </div>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="flex items-center gap-3">
                <button type="submit"
                        class="bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm px-5 py-2.5 rounded-lg transition-colors shadow-sm">
                    Ja, endgültig löschen
                </button>
                <a href="{% url 'dashboard:projects' %}"
                   class="text-sm text-forest/60 hover:text-forest transition-colors">
                    Abbrechen
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
